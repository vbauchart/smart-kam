services:
  postgres:
    image: postgres:16
    container_name: smartkam-db
    environment:
      POSTGRES_DB: smartkam
      POSTGRES_USER: smartkam
      POSTGRES_PASSWORD: smartkam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartkam"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartkam-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartkam.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    container_name: smartkam-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smartkam
      DB_USER: smartkam
      DB_PASSWORD: smartkam
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
