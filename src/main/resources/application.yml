spring:
  application:
    name: smart-kam

  datasource:
    url: jdbc:postgresql://localhost:5432/smartkam
    username: smartkam
    password: smartkam
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.smartkam: DEBUG
    org.flywaydb: INFO
