<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Two fragments used by FamilyController:

  computed-rows  — pure <tr> elements for sections ③ and ④, no OOB.
                   Used for initial page render via th:replace in detail.html.

  recalc         — full HTMX response returned by all POST endpoints.
                   Contains: new <tbody id="sections-computed"> (primary outerHTML swap)
                           + <tr id="sop-initial-row" hx-swap-oob="true"> (OOB swap)
-->

<!-- ==========================================================================
     FRAGMENT: computed-rows — sections ③ and ④
     ========================================================================== -->
<th:block th:fragment="computed-rows">

    <!-- Spacer -->
    <tr class="spacer-row">
        <td class="stick-a"></td><td class="stick-b"></td><td class="stick-c"></td>
        <th:block th:each="r : ${view.refs}"><td class="col-ref"></td></th:block>
        <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
    </tr>

    <!-- ③ Section header -->
    <tr class="section-row sec-updated">
        <td class="stick-a" style="border-left:4px solid var(--sec-updated);"></td>
        <td class="stick-b">③ Prix SOP Actualisés (F2)</td>
        <td class="stick-c"></td>
        <th:block th:each="r : ${view.refs}"><td class="col-ref"></td></th:block>
        <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
    </tr>

    <!-- ③ Sub-header -->
    <tr class="subsection-row">
        <td class="stick-a"></td><td class="stick-b"></td><td class="stick-c"></td>
        <th:block th:each="ref : ${view.refs}">
            <td class="col-ref" style="text-align:center;" th:text="${ref.refInternal}">—</td>
        </th:block>
        <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
    </tr>

    <!-- Updated base -->
    <tr>
        <td class="stick-a"></td>
        <td class="stick-b">Prix de base actualisé</td>
        <td class="stick-c"></td>
        <th:block th:each="v : ${view.updatedBases}">
            <td class="col-ref num" th:text="${#numbers.formatDecimal(v, 1, 'NONE', 3, 'POINT')}">—</td>
        </th:block>
        <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
    </tr>

    <!-- Updated R&D -->
    <tr>
        <td class="stick-a"></td>
        <td class="stick-b">Amort. R&amp;D actualisé</td>
        <td class="stick-c"></td>
        <th:block th:each="v : ${view.updatedRds}">
            <td class="col-ref num" th:text="${#numbers.formatDecimal(v, 1, 'NONE', 3, 'POINT')}">—</td>
        </th:block>
        <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
    </tr>

    <!-- Packaging (unchanged) -->
    <tr>
        <td class="stick-a"></td>
        <td class="stick-b">Packaging</td>
        <td class="stick-c"></td>
        <th:block th:each="ref : ${view.refs}">
            <td class="col-ref num"
                th:text="${#numbers.formatDecimal(ref.priceBreakdown.packaging, 1, 'NONE', 3, 'POINT')}">—</td>
        </th:block>
        <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
    </tr>

    <!-- SOP Updated total -->
    <tr class="total-row tot-updated">
        <td class="stick-a"></td>
        <td class="stick-b fw-bold">Prix SOP Actualisé</td>
        <td class="stick-c"></td>
        <th:block th:each="v : ${view.sopUpdated}">
            <td class="col-ref num fw-bold"
                th:text="${#numbers.formatDecimal(v, 1, 'NONE', 3, 'POINT')}">—</td>
        </th:block>
        <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
    </tr>

    <!-- SOP Updated — SIMULATION row -->
    <tr th:if="${view.simulating}" class="total-row" style="background:#fff8e1;">
        <td class="stick-a" style="border-left:3px dashed #ff9800;"></td>
        <td class="stick-b fw-bold" style="color:#e65100;">SOP Simulé</td>
        <td class="stick-c"></td>
        <th:block th:each="v : ${view.simSopUpdated}">
            <td class="col-ref num fw-bold" style="color:#e65100;"
                th:text="${#numbers.formatDecimal(v, 1, 'NONE', 3, 'POINT')}">—</td>
        </th:block>
        <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
    </tr>

    <!-- Delta vs LOI -->
    <tr class="delta-row">
        <td class="stick-a"></td>
        <td class="stick-b text-muted small">Écart vs LOI</td>
        <td class="stick-c"></td>
        <th:block th:each="d : ${view.deltas}">
            <td class="col-ref num"
                th:classappend="${d.signum() > 0} ? 'num positive' : (${d.signum() < 0} ? 'num negative' : 'num zero')"
                th:text="${(d.signum() >= 0 ? '+' : '') + #numbers.formatDecimal(d, 1, 'NONE', 3, 'POINT')}">—</td>
        </th:block>
        <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
    </tr>

    <!-- Delta vs LOI — SIMULATION row -->
    <tr th:if="${view.simulating}" class="delta-row" style="background:#fff8e1;">
        <td class="stick-a" style="border-left:3px dashed #ff9800;"></td>
        <td class="stick-b text-muted small" style="color:#e65100;">Écart simulé</td>
        <td class="stick-c"></td>
        <th:block th:each="d : ${view.simDeltas}">
            <td class="col-ref num" style="color:#e65100;"
                th:classappend="${d.signum() > 0} ? 'positive' : (${d.signum() < 0} ? 'negative' : 'zero')"
                th:text="${(d.signum() >= 0 ? '+' : '') + #numbers.formatDecimal(d, 1, 'NONE', 3, 'POINT')}">—</td>
        </th:block>
        <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
    </tr>

    <!-- Spacer -->
    <tr class="spacer-row">
        <td class="stick-a"></td><td class="stick-b"></td><td class="stick-c"></td>
        <th:block th:each="r : ${view.refs}"><td class="col-ref"></td></th:block>
        <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
    </tr>

    <!-- ④ Section header -->
    <tr class="section-row sec-proj">
        <td class="stick-a" style="border-left:4px solid var(--sec-proj);"></td>
        <td class="stick-b">④ Projection Annuelle</td>
        <td class="stick-c"></td>
        <th:block th:each="r : ${view.refs}"><td class="col-ref"></td></th:block>
        <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
    </tr>

    <!-- ④ Sub-header -->
    <tr class="subsection-row">
        <td class="stick-a">Année</td>
        <td class="stick-b">Événement</td>
        <td class="stick-c"></td>
        <th:block th:each="ref : ${view.refs}">
            <td class="col-ref" style="text-align:center;" th:text="${ref.refInternal}">—</td>
        </th:block>
        <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
    </tr>

    <!-- Projection rows -->
    <th:block th:each="pr : ${view.projection}">

        <!-- Ellipsis (prices == null sentinel) -->
        <tr th:if="${pr.prices == null}" class="ellipsis-row">
            <td th:attr="colspan=${3 + #lists.size(view.refs) + 3}"
                style="text-align:center;padding:2px!important;">· · ·</td>
        </tr>

        <!-- Regular projection row -->
        <tr th:unless="${pr.prices == null}" th:class="${pr.rowClass}">
            <td class="stick-a" style="line-height:1.3;">
                <span class="fw-bold" th:text="${pr.label}">SOP</span><br>
                <span style="font-weight:400;color:#999;font-size:10px;" th:text="${pr.year}"></span>
            </td>
            <td class="stick-b small" th:text="${pr.event}"></td>
            <td class="stick-c"></td>
            <th:block th:each="p : ${pr.prices}">
                <td class="col-ref num"
                    th:text="${#numbers.formatDecimal(p, 1, 'NONE', 3, 'POINT')}">—</td>
            </th:block>
            <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
        </tr>

    </th:block>

    <!-- Simulation projection — separate block after real projection -->
    <th:block th:if="${view.simulating}">
        <tr class="spacer-row">
            <td class="stick-a"></td><td class="stick-b"></td><td class="stick-c"></td>
            <th:block th:each="r : ${view.refs}"><td class="col-ref"></td></th:block>
            <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
        </tr>
        <tr class="section-row" style="background:#fff8e1;border-left:3px dashed #ff9800;">
            <td class="stick-a" style="border-left:3px dashed #ff9800;"></td>
            <td class="stick-b" style="color:#e65100;">Projection simulée</td>
            <td class="stick-c"></td>
            <th:block th:each="r : ${view.refs}"><td class="col-ref"></td></th:block>
            <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
        </tr>
        <th:block th:each="pr : ${view.simProjection}">
            <tr th:if="${pr.prices == null}" class="ellipsis-row" style="background:#fff8e1;">
                <td th:attr="colspan=${3 + #lists.size(view.refs) + 3}"
                    style="text-align:center;padding:2px!important;">· · ·</td>
            </tr>
            <tr th:unless="${pr.prices == null}" th:class="${pr.rowClass}" style="background:#fff8e1;">
                <td class="stick-a" style="border-left:3px dashed #ff9800;line-height:1.3;">
                    <span class="fw-bold" style="color:#e65100;" th:text="${pr.label}">SOP</span><br>
                    <span style="font-weight:400;color:#bf360c;font-size:10px;" th:text="${pr.year}"></span>
                </td>
                <td class="stick-b small" style="color:#e65100;" th:text="${pr.event}"></td>
                <td class="stick-c"></td>
                <th:block th:each="p : ${pr.prices}">
                    <td class="col-ref num" style="color:#e65100;"
                        th:text="${#numbers.formatDecimal(p, 1, 'NONE', 3, 'POINT')}">—</td>
                </th:block>
                <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
            </tr>
        </th:block>
    </th:block>

</th:block>


<!-- ==========================================================================
     FRAGMENT: recalc — full HTMX response for POST endpoints
     hx-target="#sections-computed" hx-swap="outerHTML"
     ========================================================================== -->
<th:block th:fragment="recalc">

    <!-- New tbody replaces #sections-computed via outerHTML -->
    <tbody id="sections-computed">
        <th:block th:replace="~{families/_recalc-fragment :: computed-rows}"></th:block>
    </tbody>

    <!-- OOB: update SOP Initial row in section ① -->
    <tr id="sop-initial-row" class="total-row tot-initial" hx-swap-oob="true">
        <td class="stick-a"></td>
        <td class="stick-b fw-bold">Prix SOP Initial</td>
        <td class="stick-c"></td>
        <th:block th:each="sop : ${view.sopInitials}">
            <td class="col-ref num fw-bold"
                th:text="${#numbers.formatDecimal(sop, 1, 'NONE', 3, 'POINT')}">—</td>
        </th:block>
        <td class="stick-i"></td><td class="stick-j"></td><td class="stick-k"></td>
    </tr>

</th:block>

</body>
</html>
