<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — Smart KAM'">Smart KAM</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 (WebJar) -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <!-- App CSS -->
    <link rel="stylesheet" th:href="@{/css/app.css}">

    <!-- HTMX — server-side interactivity -->
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <!-- Alpine.js — client-side micro-interactions -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
</head>

<!--
  Navbar fragment — accepts a "breadcrumb" block parameter.
  Usage:  <nav th:replace="~{layout :: navbar(~{:: .my-crumbs})}">
  The block should contain <li> elements for the breadcrumb.
  If no block is provided, defaults to "Smart KAM".
-->
<nav th:fragment="navbar(crumbs)" class="app-navbar sticky-top">
    <div class="navbar-inner">
        <!-- Left: logo + breadcrumb -->
        <div class="navbar-left">
            <a class="navbar-logo" th:href="@{/}">
                <span class="brand-mark">SK</span>
            </a>
            <ol class="navbar-crumbs">
                <th:block th:replace="${crumbs} ?: ~{}">
                    <li><a th:href="@{/}">Smart KAM</a></li>
                </th:block>
            </ol>
        </div>
        <!-- Right: search + user -->
        <div class="navbar-right">
            <button class="search-btn" title="Recherche rapide">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span class="search-shortcut">Ctrl K</span>
            </button>
            <button class="user-btn" title="Compte">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </button>
        </div>
    </div>
</nav>

<div th:fragment="scripts">
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</div>
</html>
